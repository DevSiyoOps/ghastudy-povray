name: 'Quick Tests'

on:
  workflow_dispatch:
  push:
    # For now, there's nothing in the following directories that we're actually checking.
    paths-ignore: [ 'distribution/**', 'doc/**', 'source-doc/**' ]
  pull_request:
    # For now, there's nothing in the following directories that we're actually checking.
    paths-ignore: [ 'distribution/**', 'doc/**', 'source-doc/**' ]

permissions:
  contents: read

jobs:
  build_unix:
    name: 'Unix Build Test'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:

    - name: 'Check out Repository'
      uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2

    - name: 'Install Prerequisites'
      uses: POV-Ray/povray/.github/actions/unix_getlibs@1cd27888681e8dd5d9b3cb29137e478c9ff77927 # gh-actions-v1

    - name: 'Prebuild'
      uses: POV-Ray/povray/.github/actions/unix_prebuild@1cd27888681e8dd5d9b3cb29137e478c9ff77927 # gh-actions-v1
    - name: 'Sanity-Check Working Tree'
      uses: POV-Ray/povray/.github/actions/git_check_repo@1cd27888681e8dd5d9b3cb29137e478c9ff77927 # gh-actions-v1

    - name: 'Configure'
      uses: POV-Ray/povray/.github/actions/unix_configure@1cd27888681e8dd5d9b3cb29137e478c9ff77927 # gh-actions-v1
    - name: 'Sanity-Check Working Tree'
      uses: POV-Ray/povray/.github/actions/git_check_repo@1cd27888681e8dd5d9b3cb29137e478c9ff77927 # gh-actions-v1

    - name: 'Bundle Artifacts for Diagnostics'
      if: ${{ always() }}
      uses: POV-Ray/povray/.github/actions/git_bundle_ignored@1cd27888681e8dd5d9b3cb29137e478c9ff77927 # gh-actions-v1
      with:
        name: artifact_diag_unix.tar.gz

    - name: 'Build'
      uses: POV-Ray/povray/.github/actions/unix_make@1cd27888681e8dd5d9b3cb29137e478c9ff77927 # gh-actions-v1
    - name: 'Sanity-Check Working Tree'
      uses: POV-Ray/povray/.github/actions/git_check_repo@1cd27888681e8dd5d9b3cb29137e478c9ff77927 # gh-actions-v1

    - name: 'Check Functionality'
      uses: POV-Ray/povray/.github/actions/unix_make@1cd27888681e8dd5d9b3cb29137e478c9ff77927 # gh-actions-v1
      with:
        make-target: check
    - name: 'Sanity-Check Working Tree'
      uses: POV-Ray/povray/.github/actions/git_check_repo@1cd27888681e8dd5d9b3cb29137e478c9ff77927 # gh-actions-v1

#    - name: 'Install'
#      uses: POV-Ray/povray/.github/actions/unix_make@gh-actions-v1
#      with:
#        make-target: install
#    - name: 'Sanity-Check Working Tree'
#      uses: POV-Ray/povray/.github/actions/git_check_repo@gh-actions-v1

    - name: 'Upload Artifacts for Diagnostics'
      if: ${{ failure() }}
      uses: actions/upload-artifact@82c141cc518b40d92cc801eee768e7aafc9c2fa2 # v2
      with:
        name: artifact_diag_unix
        path: artifact_diag_unix.tar.gz

    # TODO: Maybe do some basic installation checking.

  build_windows:
    name: 'Windows Build Test'
    runs-on: windows-2022
    timeout-minutes: 60
    steps:

    - name: 'Check out Repository'
      uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2

    - name: 'Add MSBuild to PATH'
      uses: microsoft/setup-msbuild@c26a08ba26249b81327e26f6ef381897b6a8754d # v1.0.2

    - name: 'Build'
      uses: POV-Ray/povray/.github/actions/windows_build@1cd27888681e8dd5d9b3cb29137e478c9ff77927 # gh-actions-v1
      with:
        pov-ray-build-id: gh${{github.run_number}}
        solution: vs2015
        configuration: Release
        platform: x64
        toolset: v142
        msbuild-options: ''
    - name: 'Sanity-Check Working Tree'
      uses: POV-Ray/povray/.github/actions/git_check_repo@1cd27888681e8dd5d9b3cb29137e478c9ff77927 # gh-actions-v1
